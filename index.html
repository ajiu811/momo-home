<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Momo 主界面</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #fff0f5 0%, #ffe4ee 50%, #ffd6e8 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      overflow-x: hidden;
    }

    /* 顶部装饰波浪 */
    .top-wave {
      width: 100%;
      height: 12px;
      background: repeating-linear-gradient(
        90deg,
        #f9b8cc 0px, #f9b8cc 20px,
        #fcd4e3 20px, #fcd4e3 40px
      );
      border-radius: 0 0 50% 50% / 0 0 8px 8px;
    }

    /* 整体内容区域 */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 480px;
      padding: 24px 24px;
    }

    /* Kitty 区域 */
    .kitty-wrapper {
      margin-top: 0;
      position: relative;
      display: flex;
      justify-content: center;
    }

    .kitty-wrapper img {
      width: 220px;
      height: auto;
      filter: drop-shadow(0 8px 20px rgba(249, 148, 180, 0.35));
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-10px); }
    }

    /* 问候语 */
    .greeting {
      margin-top: 18px;
      font-size: 20px;
      font-weight: 700;
      color: #d85c8a;
      letter-spacing: 1px;
      text-shadow: 0 1px 4px rgba(216, 92, 138, 0.15);
      text-align: center;
    }

    /* 搜索框 */
    .search-wrapper {
      margin-top: 24px;
      width: 100%;
      position: relative;
    }

    .search-wrapper input {
      width: 100%;
      padding: 14px 52px 14px 20px;
      border-radius: 40px;
      border: 2px solid #f9c0d4;
      background: #fff;
      font-size: 15px;
      color: #555;
      outline: none;
      box-shadow: 0 4px 18px rgba(249, 148, 180, 0.2);
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .search-wrapper input::placeholder {
      color: #e0a0bb;
    }

    .search-wrapper input:focus {
      border-color: #f088b0;
      box-shadow: 0 4px 22px rgba(240, 136, 176, 0.35);
    }

    .search-icon {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      cursor: pointer;
      color: #e07aa0;
      transition: transform 0.2s;
    }

    .search-icon:hover {
      transform: translateY(-50%) scale(1.2);
    }

    /* 功能入口区 */
    .nav-section {
      margin-top: 36px;
      width: 100%;
    }

    .nav-section-title {
      font-size: 13px;
      color: #c888a8;
      margin-bottom: 16px;
      text-align: center;
      letter-spacing: 2px;
    }

    .nav-grid {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      text-decoration: none;
      padding: 14px 6px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(8px);
      border: 1.5px solid #fcd4e3;
      box-shadow: 0 3px 12px rgba(249, 148, 180, 0.15);
      transition: all 0.22s ease;
    }

    .nav-item:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 8px 24px rgba(249, 148, 180, 0.35);
      border-color: #f088b0;
    }

    .nav-item:active {
      transform: translateY(-2px);
    }

    .nav-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      line-height: 1;
    }

    /* 每个图标独立背景色 */
    .nav-item:nth-child(1) .nav-icon { background: #ffe0ec; }
    .nav-item:nth-child(2) .nav-icon { background: #fff3d6; }
    .nav-item:nth-child(3) .nav-icon { background: #d6f5e3; }
    .nav-item:nth-child(4) .nav-icon { background: #e8d6ff; }
    .nav-item:nth-child(5) .nav-icon { background: #d6eeff; }

    .nav-label {
      font-size: 11px;
      color: #c070a0;
      font-weight: 600;
      text-align: center;
      line-height: 1.2;
    }

    /* 跑步小人 SVG */
    .runner-svg {
      width: 24px;
      height: 24px;
    }

    /* 底部装饰 */
    .footer-dots {
      margin-top: 44px;
      display: flex;
      gap: 8px;
    }

    .footer-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f9b8cc;
      opacity: 0.6;
    }

    .footer-dots span:nth-child(2) {
      opacity: 1;
      background: #e870a8;
      width: 24px;
      border-radius: 4px;
    }

    /* 小爱心装饰 */
    .deco-hearts {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .heart {
      position: absolute;
      font-size: 14px;
      opacity: 0.12;
      animation: drift linear infinite;
    }

    @keyframes drift {
      0%   { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.12; }
      90%  { opacity: 0.12; }
      100% { transform: translateY(-60px) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- 漂浮爱心背景 -->
  <div class="deco-hearts" id="hearts"></div>

  <div class="top-wave"></div>

  <div class="container" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;">

    <!-- Kitty 图片 -->
    <div class="kitty-wrapper">
      <img src="kittyy.PNG" alt="Hello Kitty" />
    </div>

    <!-- 问候语 -->
    <div class="greeting">有什么momo可以帮忙的吗？</div>

    <!-- 搜索框 -->
    <div class="search-wrapper">
      <input type="text" placeholder="搜索一下～" id="searchInput" />
      <span class="search-icon" onclick="handleSearch()">🔍</span>
    </div>

    <!-- 功能入口 -->
    <nav class="nav-section">
      <div class="nav-grid">

        <!-- 1. 跑步（运动） -->
        <a class="nav-item" href="#" data-key="run" onclick="navTo('run', event)">
          <div class="nav-icon">
            <svg class="runner-svg" viewBox="0 0 24 24" fill="none" stroke="#d85c8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="14" cy="3" r="1.5"/>
              <path d="M9 17l1-4 2 2 3-3"/>
              <path d="M7 21l2-4 4 1 3-3 2 1"/>
              <path d="M12 13l-1-4 3-1 2 3"/>
            </svg>
          </div>
          <span class="nav-label">健康</span>
        </a>

        <!-- 2. 钟表（日程） -->
        <a class="nav-item" href="#" data-key="clock" onclick="navTo('clock', event)">
          <div class="nav-icon">⏰</div>
          <span class="nav-label">日程</span>
        </a>

        <!-- 3. 💰 记账 -->
        <a class="nav-item" href="#" data-key="money" onclick="navTo('money', event)">
          <div class="nav-icon">💰</div>
          <span class="nav-label">记账</span>
        </a>

        <!-- 4. 服装 -->
        <a class="nav-item" href="#" data-key="outfit" onclick="navTo('outfit', event)">
          <div class="nav-icon">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#9b59b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 8l-4-4-4 2-4-2-4 4 3 2v10h10V10z"/>
              <path d="M12 6v6"/>
            </svg>
          </div>
          <span class="nav-label">穿搭</span>
        </a>

        <!-- 5. 🖥️ 桌面 -->
        <a class="nav-item" href="#" data-key="desktop" onclick="navTo('desktop', event)">
          <div class="nav-icon">🖥️</div>
          <span class="nav-label">常用网址</span>
        </a>

      </div>
    </nav>

  </div>

  <script>
    // ── 路由配置：把各模块的实际 URL 填到这里 ──
    const routes = {
      run:     '#',           // 运动页面 URL
      clock:   '../todolist/index.html',   // 日程/Todo 页面
      money:   '../智能记账本/index.html', // 记账页面
      outfit:  '#',           // 穿搭页面 URL
      desktop: '#',           // 桌面页面 URL
    };

    function navTo(key, e) {
      e.preventDefault();
      const url = routes[key];
      if (url && url !== '#') {
        window.location.href = url;
      } else {
        showToast('该功能即将上线，敬请期待 🌸');
      }
    }

    function handleSearch() {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) return;
      showToast(`搜索「${q}」功能即将开放 🔍`);
    }

    document.getElementById('searchInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') handleSearch();
    });

    // ── Toast 提示 ──
    function showToast(msg) {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      Object.assign(t.style, {
        position: 'fixed', bottom: '80px', left: '50%',
        transform: 'translateX(-50%)',
        background: 'rgba(216, 92, 138, 0.9)',
        color: '#fff', padding: '10px 22px',
        borderRadius: '24px', fontSize: '14px',
        boxShadow: '0 4px 16px rgba(216,92,138,0.3)',
        zIndex: '9999', whiteSpace: 'nowrap',
        animation: 'fadeInUp 0.3s ease'
      });
      document.head.insertAdjacentHTML('beforeend',
        '<style>@keyframes fadeInUp{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}</style>');
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2400);
    }

    // ── 漂浮爱心 ──
    const heartsContainer = document.getElementById('hearts');
    const heartSymbols = ['♡', '✿', '♡', '✦', '♡'];
    for (let i = 0; i < 18; i++) {
      const h = document.createElement('span');
      h.className = 'heart';
      h.textContent = heartSymbols[i % heartSymbols.length];
      h.style.left = Math.random() * 100 + 'vw';
      h.style.fontSize = (10 + Math.random() * 12) + 'px';
      h.style.animationDuration = (12 + Math.random() * 18) + 's';
      h.style.animationDelay = (Math.random() * 15) + 's';
      heartsContainer.appendChild(h);
    }
  </script>

</body>
</html>
